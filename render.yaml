services:
  # ========================================
  # Node.js Core Backend
  # ========================================
  - type: web
    name: ssb-nextgen-backend-core
    env: node
    plan: free
    rootDir: backend-core
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: ENABLE_WAF
        value: "true"
      - key: ENABLE_RATE_LIMITING
        value: "true"
      - key: ENABLE_AUTH
        value: "true"
      # Crucial: Disable Redis so it works for free without crashing
      - key: ENABLE_REDIS_MATCHMAKING
        value: "false"

  # ========================================
  # Python AI Backend
  # ========================================
  - type: web
    name: ssb-nextgen-backend-ai
    env: python
    plan: free
    rootDir: backend-ai
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
