services:
  - type: web
    name: ssb-nextgen-backend-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: "3.12"
