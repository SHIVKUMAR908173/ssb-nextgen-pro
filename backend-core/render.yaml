services:
  - type: web
    name: ssb-nextgen-backend-core
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: CORS_ORIGIN
        value: "http://localhost:3000"
      - key: ENABLE_WAF
        value: "true"
      - key: ENABLE_RATE_LIMITING
        value: "true"
      - key: ENABLE_AUTH
        value: "true"
      - key: ENABLE_REDIS_MATCHMAKING
        value: "true"
